name: Tests
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pytest defusedxml
      - run: python -m compileall -q custom_components
      - run: pytest -q
      - run: node --input-type=module --check < custom_components/tiny_liveboard/frontend/display.js
      - run: node tests/camera.test.mjs
      - run: node tests/weather.test.mjs
      - run: node --input-type=module --check < custom_components/tiny_liveboard/frontend/weather.js
